name: Windows build

on:
  push:
    branches: [feature/ai-batch-import]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ApexTodo-AI-Companion-Windows-x64
          path: release/*.exe
          if-no-files-found: error
